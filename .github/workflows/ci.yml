# 灵云01号飞艇伴飞电脑 — GitHub Actions CI
#
# 作业:
#   lint        快速静态检查(不编译、不装运行依赖)
#   build-test  矩阵 [x86_64, arm64]:colcon build + colcon test
#
# 说明:
#   - 不使用容器镜像(osrf/ros),避免 GitHub 共享 runner 的 Docker Hub 匿名拉取
#     限流导致 "Docker pull failed"。改为在 runner 上经 ros-tooling/setup-ros
#     apt 安装 ROS 2 Jazzy(与 ubuntu-24.04/24.04-arm 的 noble 完全匹配)。
#   - arm64 runner 使用 ubuntu-24.04-arm(GitHub 2024 起提供免费 arm64 runner)。
#   - 闭源代码:不调用 ament_copyright(各包 CMakeLists 已跳过)。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== 快速静态检查 ====================
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@0.7.19
        with:
          required-ros-distributions: jazzy

      - name: Install ament linters
        run: |
          source /opt/ros/jazzy/setup.bash
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ros-jazzy-ament-lint-common shellcheck

      - name: Run linters
        run: |
          source /opt/ros/jazzy/setup.bash
          CPP=$(find src -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.cc' \))
          PY=$(find src -type f -name '*.py')
          CMAKE=$(find src -type f -name 'CMakeLists.txt')
          XML=$(find src -type f -name 'package.xml')
          echo '==> ament_uncrustify'
          ament_uncrustify $CPP
          echo '==> ament_cpplint'
          ament_cpplint $CPP
          echo '==> ament_lint_cmake'
          ament_lint_cmake $CMAKE
          echo '==> ament_xmllint'
          ament_xmllint $XML
          echo '==> ament_flake8 / ament_pep257'
          ament_flake8 $PY
          ament_pep257 $PY

          echo '==> shellcheck (tools/ 下 bash 脚本, severity=error)'
          SH=$(find tools -type f -name '*.sh')
          # 增量引入: 先收集 error 级问题, 当前不阻塞(现有脚本可能含历史告警需分批清理)
          shellcheck --severity=error $SH || true

  # ==================== 编译 + 测试(矩阵)====================
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            arch: x86_64
          - runs-on: ubuntu-24.04-arm   # GitHub arm64 runner
            arch: arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@0.7.19
        with:
          required-ros-distributions: jazzy

      - name: Install dependencies
        run: |
          source /opt/ros/jazzy/setup.bash
          sudo apt-get update -qq
          # libmosquitto-dev 无 rosdep 规则(不在 rosdistro),必须显式安装;airship_cloud 依赖它
          sudo apt-get install -y -qq --no-install-recommends \
            ros-jazzy-ament-lint-common libmosquitto-dev
          rosdep update -q
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          # 注: GitHub runner 多核资源充足, 故此处不设 MAKEFLAGS="-j1"(与 .trae 编译规则一致),
          # 仅在本机/树莓派 4 核低配环境强制单线程(见 .trae/rules/编译规则.md)。
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release -Wno-dev

      - name: Setup vcan0 for integration tests
        id: vcan
        run: |
          # BMS 集成测试依赖虚拟 CAN 接口 vcan0。GitHub 官方 runner 使用 Azure Linux
          # 内核, 不含 vcan 模块(见 actions/runner-images#13991), 无法创建 vcan0。
          # 此处尽力创建并输出 vcan_ok 标记: 仅 vcan0 真正可用时才执行集成测试
          # (与 airship_can 单测在 CI 的 vcan 跳过策略一致), 否则跳过而非失败。
          sudo modprobe vcan 2>/dev/null || true
          if sudo ip link add dev vcan0 type vcan 2>/dev/null && \
             sudo ip link set vcan0 up; then
            echo "vcan_ok=true" >> "$GITHUB_OUTPUT"
            echo "vcan0 已就绪"
          else
            echo "vcan_ok=false" >> "$GITHUB_OUTPUT"
            echo "无法创建 vcan0(官方 runner 内核不含 vcan 模块), 跳过 BMS 集成测试"
          fi

      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          # --return-code-on-test-failure: 任一测试失败即阻塞流水线(质量门禁)
          # --executor sequential: 顺序执行,避免资源竞争导致偶发失败
          colcon test --event-handlers console_cohesion+ \
            --return-code-on-test-failure --executor sequential
          colcon test-result --verbose

      - name: End-to-end integration test (BMS link)
        if: steps.vcan.outputs.vcan_ok == 'true'
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          bash tools/integration_test_bms.sh online
          bash tools/integration_test_bms.sh offline

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.arch }}
          path: |
            build/**/Testing/**/Test.xml
            build/**/test_results/**/*.xunit.xml
