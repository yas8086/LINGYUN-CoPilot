# 灵云01号伴飞电脑 — journald 日志上限配置
#
# 问题: 树莓派无 RTC, 长时间运行日志会累积占满 TF 卡。
# 		 systemd 将所有服务日志写入 journald, 需限制其最大占用。
#
# 安装: sudo cp 90-airship-journald.conf /etc/systemd/journald.conf.d/
#       sudo systemctl restart systemd-journald
#
# 效果:
#   - journal 日志总量上限 50MB
#   - 单文件 20MB, 保留 3 份
#   - 超过上限自动丢弃最旧日志

[Journal]
SystemMaxUse=50M
SystemMaxFileSize=20M
MaxFiles=3
Compress=yes
Storage=auto