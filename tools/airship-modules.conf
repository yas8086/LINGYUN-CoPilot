# 灵云01号伴飞电脑 — 必加载内核模块
#
# 路径：/etc/modules-load.d/airship-modules.conf
#
# 作用：开机自动加载下列模块，保证扩展板（SPI/UART/CAN/USB-CDC）驱动就绪
#
# 安装：sudo cp tools/airship-modules.conf /etc/modules-load.d/
# 验证：重启后用 lsmod | grep <模块名> 查看；未加载用 sudo modprobe <模块名> 调试

# ---------- CAN 总线 ----------
can
can_raw
can_dev
can_bcm

# ---------- SPI 转 CAN / CAN FD ----------
mcp251x        # MCP2515 (SPI CAN 2.0)
mcp251xfd      # MCP2518FD (SPI CAN FD)
spi_bcm2835    # 树莓派5 SPI 主控制器 (bcm2712/rp1)

# ---------- SPI 转双 UART (SC16IS752 → SC16IS7xx) ----------
# 注意：SC16IS752 驱动主名为 sc16is7xx，SPI 传输还依赖 regmap-spi
sc16is7xx
regmap_spi

# ---------- 串口/UART 驱动基础 ----------
serial_core
amba_pl011     # 板载 UART (ttyAMA*)
usbserial      # USB-CDC 串口基础
cdc_acm        # PCIe/USB 转 ACM 串口 (Mcuzone MPUUART ttyACM*)
ftdi_sio       # 旧版 FTDI USB-RS485 兼容（保留）
cp210x         # 备用：CP210x USB 串口兼容

# ---------- 通用 USB 转 UART（备用） ----------
ch341          # 备用：CH340/CH341

# ---------- PPP / QMI（4G 模块拨号备用） ----------
# 注：Ubuntu 24.04 一般由 ModemManager 按需加载，这里兜底
usb_wwan
option
qmi_wwan
