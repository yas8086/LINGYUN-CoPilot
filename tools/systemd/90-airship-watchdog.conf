# 灵云01号伴飞电脑 — systemd 看门狗配置（配合树莓派硬件看门狗）
#
# 放置: /etc/systemd/system.conf.d/90-airship-watchdog.conf
# 作用:
#   RuntimeWatchdogSec=20 : systemd 周期性喂内核看门狗; 若 PID1 卡死超过该时长
#                           不喂狗, 硬件看门狗触发，系统硬件复位(无人值守自愈)。
#   RebootWatchdogSec=30  : 正常 reboot 时，若 30s 内没完成则硬件强制复位，
#                           防止关机/重启流程卡死。
# 前提: config.txt 已 `dtparam=watchdog=on` 启用 bcm2835-wdt（见 rpi5_ubuntu2404_config.txt）。
# 生效: 需重新加载 systemd 配置: systemctl daemon-reload && systemctl restart systemd-journald(可选)
#       实际需重启生效: /etc/systemd/system.conf.d 在 systemd 启动早期加载。
[Manager]
RuntimeWatchdogSec=20
RebootWatchdogSec=30