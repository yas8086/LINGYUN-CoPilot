# 灵云01号飞艇伴飞电脑 — cpplint 配置(ament_cpplint 从文件目录向上查找此文件)
# 行宽与 .clang-format 对齐为 100(Google 默认 80)
linelength=100

# 放宽/关闭的规则(均与 clang-format 固有冲突或闭源/CJK 相关,已注明原因):
# - legal/copyright:      闭源代码,ament_copyright 无 proprietary 模板,版权头由 package.xml 维护
# - whitespace/comments:  与 .clang-format 的 SpacesBeforeTrailingComments(ROS2 标准 1 空格)冲突,cpplint 要求 2 空格
# - whitespace/line_length: cpplint 按 UTF-8 字节计行(CJK 占 3 字节),对中文注释代码库不可靠;代码行宽由 .clang-format ColumnLimit:100 保证
# - build/include_order:   由 .clang-format 的 IncludeBlocks:Regroup 统一管理,避免双重检查冲突
# - build/c++11:           已强制 C++17,无需 C++03 兼容性提示
# - readability/nolint:    允许保留已格式化的注释
# - build/include_subdir:  项目头文件按包组织,不强制单层
filter=-legal/copyright,-whitespace/comments,-whitespace/line_length,-build/include_order,-build/c++11,-readability/nolint,-build/include_subdir
