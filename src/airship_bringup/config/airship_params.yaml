# 灵云01号伴飞电脑 设备监控参数
# 各节点按节点名分组加载

bms_node:
  ros__parameters:
    # CAN 接口名: 102S 主电源 BMS(500kbps) 接微雪扩展板 CAN1(MCP2518FD),
    # 与 can0 的 MPPT/DCDC(250kbps) 分通道(波特率不同不可共线)。
    # 注意: BMS 设备侧端子名为"CAN0"(COM-PCS PIN4/5), 系统接口名是 can1, 勿混淆。
    can_interface: "can1"
    # 电池单体串数 (三元锂 102 串)
    cell_count: 102
    # 无数据超时 (s): 超过该时长未收到任何有效帧, 兜底发布 online=false
    link_timeout_s: 3.0
    # ---- 上报字段说明 (由 bms_protocol 解析 CAN 帧后填充, 非参数) ----
    # pack_voltage / pack_current / soc / real_soc(真实SOC)
    # max_cell_voltage / min_cell_voltage / cell_voltage_diff (单体电压与压差)
    # max_cell_temp / min_cell_temp / avg_cell_temp / temp_diff (温度统计)
    # pole_temps[8] (极耳温度)
    # positive_insulation_kohm / negative_insulation_kohm (正负极绝缘电阻)
    # alarm_level (告警级别: 0正常 1故障 2严重)

mppt_node:
  ros__parameters:
    can_interface: "can0"
    # 查询频率 (Hz)
    query_rate_hz: 1.0
    # MPPT 从机设备地址
    device_addr: 1
    # 无数据超时 (s): 超过该时长未收到任何有效帧, 兜底发布 online=false
    link_timeout_s: 3.0

# 副 MPPT(设备地址 02, 副太阳能板), launch 中 mppt2_node 实例加载;
# 此前无独立 section 时仅靠代码默认值运行(隐性耦合), 现显式声明消除参数漂移
mppt2_node:
  ros__parameters:
    can_interface: "can0"
    query_rate_hz: 1.0
    device_addr: 2
    # 发布话题: /mppt2/status (launch 中同名参数覆盖, 此处保持一致)
    topic_name: "/mppt2/status"
    link_timeout_s: 3.0

backup_bms_node:
  ros__parameters:
    # 12S 备用电源 BMS 串口 (北辰协议 V1.4, 默认 9600 8N1)
    # 使用 udev 固定符号链接, 避免 /dev/ttyUSB* 枚举顺序变化串号
    serial_device: "/dev/airship_backup_bms"
    baud_rate: 9600
    # 从机地址 / 主机信息 (上位机 0x10)
    addr: 255                # 0xFF
    host: 16                 # 0x10
    # 轮询周期 (ms)
    sample_period_ms: 1000
    # 单次响应超时 (ms)
    resp_timeout_ms: 200
    # 串口自动重连周期 (ms)
    reconnect_ms: 2000

dcdc_node:
  ros__parameters:
    can_interface: "can0"
    # 保留兼容声明(控制保活实际由 dcdc_hold 承担, 频率取自其环境变量 DCDC_PERIOD_MS)
    control_rate_hz: 5.0
    # 输出电压设定 (V)  (与 dcdc_hold 环境变量 DCDC_SET_VOLTAGE 保持一致)
    set_voltage: 49.0
    # 输出限流 (A)  (与 dcdc_hold 环境变量 DCDC_SET_CURRENT 保持一致)
    set_current: 5.0
    # 无数据超时 (s): 超过该时长未收到任何有效帧, 兜底发布 online=false
    link_timeout_s: 3.0
    # 注: 开机/关机由 dcdc_hold 进程环境变量 DCDC_ENABLED 决定,
    #     dcdc_node 只读监控不消费 dcdc_enabled; 已移除无效的 query_rate_hz 参数

lora_node:
  ros__parameters:
    # 集中器 485 串口 (USB-RS485 转换器 = FTDI FT232R)
    # 使用 udev 固定符号链接, 避免 /dev/ttyUSB* 枚举顺序变化串号
    serial_device: "/dev/airship_485"
    baud_rate: 9600
    # Modbus 从机地址
    slave_addr: 1
    # LoRa 节点配置: node_ids 与 node_types 一一对应
    #   type: "temperature" -> 读温度寄存器
    #         "pressure"    -> 读温度 + 压力寄存器
    # 共 6 个节点: 1/2/3/4/5 温度探头, 6 压力+温度 (0x76C1 起逐节点 +1)
    node_ids: [1, 2, 3, 4, 5, 6]
    node_types: [
      "temperature", "temperature", "temperature",
      "temperature", "temperature", "pressure"]
    # 采集周期 (ms)
    sample_period_ms: 2000
    # 温度/压力寄存器起始地址
    # 注: 温度寄存器正确值为 0x76C1=30401 (曾误填 30393=0x76B9, 导致集中器对未映射地址
    #     统一返回 raw=0, 温度恒为 0.00℃)
    temp_reg_addr: 30401          # 0x76C1
    pressure_reg_addr: 36601      # 0x8EF9
    # 温度报警阈值 (℃)
    alarm_low: -10.0
    alarm_high: 60.0
    # 单次 Modbus 响应超时 (ms)
    resp_timeout_ms: 200
    # 串口自动重连周期 (ms): 检测到串口掉线后按此周期尝试重连
    reconnect_ms: 2000

monitor_node:
  ros__parameters:
    # 看门狗检测频率 (Hz)
    watchdog_rate_hz: 1.0
    # 设备离线判定超时 (s)
    link_timeout_s: 3.0

safety_node:
  ros__parameters:
    # 安全状态发布频率 (Hz)
    pub_rate_hz: 10.0
    # DCDC 判据超时 (s): 超时未收到 DCDC 状态视为不安全 (fail-safe)
    dcdc_timeout_s: 3.0
    # 主 BMS 判据超时 (s)
    bms_timeout_s: 3.0
    # 主 BMS 总压下限 (V)
    bms_min_voltage: 40.0
    # 12S 备用电源判据超时 (s)
    backup_bms_timeout_s: 3.0
    # 12S 备用电源总压下限 (V) (12S 磷酸铁锂 27Ah, 满电 ~43.2V, 过放保护 ~24V)
    backup_bms_min_voltage: 24.0

link_node:
  ros__parameters:
    # 数传串口设备 (使用 udev 固定符号链接, 见 tools/70-airship-usb.rules)
    # 【临时调试】指向微雪板 RS232 (ttyAMA0), 供电脑 232 线监听下传 JSON;
    # 数传电台接好后恢复为 "/dev/airship_link"。
    serial_device: "/dev/ttyAMA0"
    # 波特率
    baud_rate: 115200
    # 遥测下传频率 (Hz)
    tx_rate_hz: 5.0
    # 串口自动重连周期 (ms)
    reconnect_ms: 2000
    # UDP 数传网口下传 (定向单播到地面站固定 IP 192.168.10.200;
    #   联调也可用广播 192.168.10.255 让任意同网段监听端接收)
    # 与串口双发冗余, 一路故障不影响另一路; host 留空则仅串口下传
    udp_host: "192.168.10.200"
    # UDP 目标端口 (避开数传端口映射段 14550/14551/14552, 用高位端口确保走 MAC 网络透传)
    udp_port: 20000

fc_monitor_node:
  ros__parameters:
    # 聚合状态发布频率 (Hz)
    pub_rate_hz: 10.0
    # 飞控掉线判定超时 (s)
    fc_timeout_s: 2.0
    # 异常告警去抖: 连续 N 次采样超限才触发告警 (防止毛刺误报)
    alert_debounce_n: 3
    # 数据日志目录 (空字符串表示禁用 CSV 记录; 需保证目录可写)
    log_dir: "/home/lingyun01/airship_fc_logs"

cloud_node:
  ros__parameters:
    # EMQX Cloud Serverless 免费部署 (lingyun01-dev, Europe / AWS eu-central-1)
    # 控制台: https://cloud-intl.emqx.com/console/projects/42048488/deployments/x99b1c81/overview
    mqtt_host: "x99b1c81.ala.eu-central-1.emqxsl.com"
    mqtt_port: 8883  # Serverless 仅支持 TLS 端口
    # 上云遥测 topic
    mqtt_topic: "lingyun01/telemetry"
    # Authentication -> Password-Based
    mqtt_username: "lingyun01_onboard"
    # 密码不落明文: 经 MQTT_PASSWORD 环境变量注入 (见 airship-device-monitor.service
    # 的 EnvironmentFile=/etc/airship/airship.env), 参数留空时 cloud_node 回退读环境变量
    mqtt_password: ""
    # TLS (EMQX Cloud Serverless 必须开启; CA 采用系统 /etc/ssl/certs 验证公签证书)
    mqtt_tls_enable: true
    mqtt_tls_ca_cert: ""
    mqtt_tls_insecure: false
    # 上云发送频率 (Hz)
    tx_rate_hz: 2.0