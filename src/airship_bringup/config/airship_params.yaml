# 灵云01号伴飞电脑 设备监控参数
# 各节点按节点名分组加载

bms_node:
  ros__parameters:
    # CAN 接口名
    can_interface: "can0"
    # 电池单体串数 (三元锂 102 串)
    cell_count: 102

mppt_node:
  ros__parameters:
    can_interface: "can0"
    # 查询频率 (Hz)
    query_rate_hz: 1.0
    # MPPT 从机设备地址
    device_addr: 1

dcdc_node:
  ros__parameters:
    can_interface: "can0"
    # 电源控制帧下发频率 (Hz), 昊瑞昌要求 200ms 周期持续发送 -> 5Hz
    control_rate_hz: 5.0
    # 模拟量查询频率 (Hz)
    query_rate_hz: 1.0
    # 输出电压设定 (V)
    set_voltage: 48.0
    # 输出限流 (A)
    set_current: 80.0
    # 是否开机
    dcdc_enabled: true

monitor_node:
  ros__parameters:
    # 看门狗检测频率 (Hz)
    watchdog_rate_hz: 1.0
    # 设备离线判定超时 (s)
    link_timeout_s: 3.0

link_node:
  ros__parameters:
    # 数传串口设备
    serial_device: "/dev/ttyUSB0"
    # 波特率
    baud_rate: 115200
    # 遥测下传频率 (Hz)
    tx_rate_hz: 5.0

fc_monitor_node:
  ros__parameters:
    # 聚合状态发布频率 (Hz)
    pub_rate_hz: 10.0
    # 飞控掉线判定超时 (s)
    fc_timeout_s: 2.0

cloud_node:
  ros__parameters:
    # MQTT broker 地址(4G 云服务器, 待定)
    mqtt_host: "localhost"
    mqtt_port: 1883
    # 上云遥测 topic
    mqtt_topic: "lingyun01/telemetry"
    # 认证(可选)
    mqtt_username: ""
    mqtt_password: ""
    # 上云发送频率 (Hz)
    tx_rate_hz: 2.0